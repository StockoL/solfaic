<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Solfaic!</title>
    <meta
      name="description"
      content="404 Page Not Found - Solfaic! is an interactive music theory learning platform that teaches solfege, sight-singing, and music composition through engaging lessons and exercises."
    />

    <link rel="preload" href="src/css/index.css" as="style" />
    <link rel="stylesheet" href="src/css/index.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Galindo&family=Poppins:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Galindo&family=Poppins:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Galindo&family=Poppins:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/media/favicon-solfaic.svg"
    />
  </head>
  <body>
    <main id="main-content" class="container">
      <div class="center flow" data-and-text data-intrinsic>
        <svg
          class="error-page__icon"
          aria-hidden="true"
          viewBox="0 0 40 100"
          fill="none"
          stroke="var(--color-action-primary)"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M 25 20 L 15 40 L 30 55 L 15 80" />
        </svg>

        <h1>404: Out of Bounds</h1>
        <p>
          Looks like that note doesn't exist in our score. Let's get you back on
          track.
        </p>
        <p role="status" aria-live="polite">
          Redirecting to Lesson 1 in
          <span id="redirect-countdown">5</span> seconds&hellip;
        </p>

        <a href="index.html" class="button" data-variant="primary"
          >Back to Lesson 1</a
        >
      </div>
    </main>

    <script>
      (() => {
        let secondsLeft = 5;
        const countdownEl = document.getElementById("redirect-countdown");
        const timer = setInterval(() => {
          secondsLeft -= 1;
          countdownEl.textContent = secondsLeft;
          if (secondsLeft <= 0) {
            clearInterval(timer);
            location.href = "index.html";
          }
        }, 1000);
      })();
    </script>

    <footer class="site-footer">
      <!-- Wrapper controls the max-width, Spread pushes items to opposite ends -->
      <div class="site-footer__inner wrapper spread">
        <p>
          &copy; 2026 Louis Mannix / Loose Leaf Applications. All rights
          reserved.
        </p>
        <ul class="footer-links cluster" role="list">
          <li>
            <a href="#privacy" data-open-target="modal-privacy"
              >Privacy Policy</a
            >
          </li>
          <li>
            <a href="#terms" data-open-target="modal-terms">Terms of Service</a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
