<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solfaic! - Rhythm Dictation</title>
    <meta
      name="description"
      content="Solfaic is an interactive musical dictation and sight-reading tool designed to train rhythmic ears using the British Kodaly Academy curriculum."
    />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Music&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Music&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Music&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div class="l-center l-stack">
      <header class="global-header">
        <div class="header-brand">
          <button class="hamburger-btn" aria-label="Menu">☰</button>
          <h1 class="logo">SOLFAIC!</h1>
        </div>
        <button id="btn-skip" class="btn-escape">Skip / New Rhythm</button>
      </header>

      <main class="workspace l-stack">
        <section class="status-bar">
          <button class="ghost-btn">← Levels</button>
          <div id="ui-level-badge" class="level-badge"></div>
          <div id="ui-streak-tracker" class="streak-tracker"></div>
        </section>

        <section class="playback-panel l-stack">
          <button id="btn-replay" class="btn-primary-audio">
            🔊 REPLAY RHYTHM
          </button>
          <p id="ui-plays-remaining" class="plays-remaining"></p>
        </section>

        <section class="input-display-panel">
          <p class="section-label">YOUR INPUT WORKSPACE:</p>
          <div id="ui-workspace" class="workspace-array"></div>
        </section>

        <section class="motif-selector-pane l-stack">
          <div class="blueprint-anchor">
            <span id="ui-metre-display">Metre: --</span>
            <span class="divider">|</span>
            <span id="ui-bars-display">Bars: --</span>
          </div>

          <div class="selector-header">
            <p class="section-label">CHOOSE MOTIFS:</p>
          </div>

          <div id="ui-motif-selector" class="l-switcher"></div>
        </section>

        <section class="action-panel">
          <button id="btn-submit" class="btn-submit">SUBMIT SEQUENCE</button>
        </section>
      </main>
    </div>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"
      defer
    ></script>
    <script src="app.js" defer></script>
  </body>
</html>
