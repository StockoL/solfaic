<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice Room - Solfaic</title>
    <meta
      name="description"
      content="Focus-mode rhythm dictation practice session for Solfaic."
    />

    <link rel="preload" href="src/css/index.css" as="style" />
    <link rel="stylesheet" href="src/css/index.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Galindo&family=Poppins:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Galindo&family=Poppins:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Galindo&family=Poppins:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/media/favicon-solfaic.svg"
    />
  </head>
  <body class="practice-room">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div class="practice-shell container">
      <!--
        THIN HEADER per plan doc: level + streak pips on the left,
        metre/bars on the right. No global nav here — focus mode strips
        everything the user doesn't need mid-exercise. "Back to Classroom"
        replaces the nav entirely.
      -->
      <header class="practice-header spread">
        <div class="practice-header__start cluster">
          <span
            id="ui-level-badge"
            class="level-badge badge"
            data-variant="primary"
            >Level 1</span
          >
          <div
            id="ui-streak-tracker"
            class="streak-tracker cluster"
            role="status"
            aria-label="Current streak"
          ></div>
        </div>

        <div class="practice-header__end cluster">
          <span id="ui-metre-display" class="meta-chip">Metre: --</span>
          <span id="ui-bars-display" class="meta-chip">Bars: --</span>
        </div>
      </header>

      <main id="main-content" class="practice-main flow">
        <div class="playback-panel cluster">
          <div class="playback-panel__replay-wrap">
            <button id="btn-replay" class="button" data-variant="primary">
              🔊 Play
            </button>
            <div
              id="ui-countdown-indicator"
              class="countdown-indicator"
              data-state="hidden"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            ></div>
          </div>
          <p id="ui-plays-remaining" class="plays-remaining" role="status"></p>
        </div>

        <!--
          WORKSPACE: one box per beat (tick), not per bar — a 4/4 exercise
          needs 4 boxes per bar, so higher levels (up to 8 bars x 4 ticks)
          can need up to 32 boxes total. Rendered entirely by JS
          (renderWorkspace in core.js) since box count, page count, and
          disabled/active state all depend on the generated exercise.
          Beyond 16 boxes, a second swipeable page is added — .workspace-pager
          reuses the same horizontal scroll-snap technique as Compositions'
          .reel, just declared here in Blocks since paging behaviour (not
          layout) is what's being added.
        -->
        <section class="workspace" aria-label="Your answer workspace">
          <div class="workspace-pager">
            <div
              id="ui-workspace"
              class="workspace-pager__track"
              role="group"
              aria-label="Rhythm workspace"
            ></div>
            <div
              id="ui-workspace-pager-nav"
              class="workspace-pager__nav"
              data-state="hidden"
            >
              <button
                id="btn-workspace-page-prev"
                class="workspace-pager__nav-btn"
                aria-label="Previous bars"
              >
                <span aria-hidden="true">‹</span>
              </button>
              <div id="ui-workspace-dots" class="workspace-pager__dots"></div>
              <button
                id="btn-workspace-page-next"
                class="workspace-pager__nav-btn"
                aria-label="Next bars"
              >
                <span aria-hidden="true">›</span>
              </button>
            </div>
          </div>
        </section>

        <!--
          PRACTICE REEL: horizontal motif selector. Cards animate on/off
          viewport (rolodex-style, Flair phase) when they exceed the visible
          width. Prev/Next buttons exist for keyboard/switch-access users who
          can't drag-scroll.
        -->
        <section class="practice-reel" aria-label="Rhythm motif selector">
          <button
            class="practice-reel__nav practice-reel__nav--prev"
            aria-label="Scroll motifs left"
          >
            <span aria-hidden="true">‹</span>
          </button>
          <div
            id="ui-motif-reel"
            class="practice-reel__track reel"
            role="listbox"
            aria-label="Available rhythm motifs"
          >
            <!-- Motif cards rendered here by JS -->
          </div>
          <button
            class="practice-reel__nav practice-reel__nav--next"
            aria-label="Scroll motifs right"
          >
            <span aria-hidden="true">›</span>
          </button>
        </section>

        <div class="action-panel">
          <button id="btn-submit" class="button" data-variant="primary">
            Submit Sequence
          </button>
        </div>
      </main>
    </div>

    <!--
      FOCUS VIGNETTE: tap-and-hold a workspace card to spotlight it full-width
      while the rest of the screen dims, with the reel still available below
      for quick edits. Escape (X) top-right returns to normal view.
    -->
    <div
      id="ui-card-vignette"
      class="vignette-overlay flow"
      data-state="closed"
      aria-modal="true"
      role="dialog"
      aria-label="Edit card"
    >
      <button class="vignette-overlay__close" aria-label="Close card editor">
        <span aria-hidden="true">✕</span>
      </button>
      <div
        class="vignette-overlay__focused-card"
        id="vignette-focused-card"
      ></div>
      <div class="vignette-overlay__reel reel" id="vignette-reel"></div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"
      defer
    ></script>
    <script type="module" src="src/js/app.js" defer></script>
  </body>
</html>
